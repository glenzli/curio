</defs>
<rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
<text x="500.00" y="35.00" fill="#17202a" font-size="24" font-weight="700" text-anchor="middle" font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif">图 10.1  RAW 显影流程及可重新选择的步骤</text>
