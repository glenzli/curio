<text x="110.00" y="445.00" fill="#c44536" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif">噪声端</text>
<text x="890.00" y="445.00" fill="#2364aa" font-size="16" font-weight="400" text-anchor="end" font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif">饱和端</text>
<text x="500.00" y="485.00" fill="#17202a" font-size="19" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif">较高 EI：更少传感器曝光</text>
<text x="500.00" y="535.00" fill="#17202a" font-size="20" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif">总传感器范围可不变；场景相对中灰的高光/阴影余量改变</text>
