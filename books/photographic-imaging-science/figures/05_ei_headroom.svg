<text x="110.00" y="255.00" fill="#c44536" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif">噪声端</text>
<text x="890.00" y="255.00" fill="#2364aa" font-size="16" font-weight="400" text-anchor="end" font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif">饱和端</text>
<text x="500.00" y="295.00" fill="#17202a" font-size="19" font-weight="400" text-anchor="middle" font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif">较低 EI：更多传感器曝光</text>
