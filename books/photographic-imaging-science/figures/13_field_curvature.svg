<text x="40.00" y="531.00" fill="#25303b" font-size="19" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif">场曲使边缘焦点离开中心焦面；逐像高重新对焦后，局部 MTF 恢复至本例的基准值。</text>
<text x="40.00" y="568.00" fill="#25303b" font-size="18" font-weight="400" text-anchor="start" font-family="Arial, PingFang SC, Hiragino Sans GB, sans-serif">重新对焦后仍有MTF损失，或两方向焦点分离时，还需结合其他像差分析。</text>
