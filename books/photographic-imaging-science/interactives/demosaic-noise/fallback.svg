<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-label="互动示意：同色样本线性插值后的空间协方差与区域平均" style="color:#303030;fill:currentColor;font:16px sans-serif"><style>text{font-family:sans-serif}</style><rect width="800" height="100%" fill="#fafafa"/><text x="30" y="42" font-size="26">插值后的像素为什么不再独立</text><text x="30" y="82">独立输入标准差3 DN，平均前4个输出位置；8192次重复观测。</text><text x="30" y="127" font-size="20">输出位置0与1各自的协方差剖面</text><svg x="30" y="143" width="740" height="300" role="img" aria-label="输出位置0与1各自的协方差剖面" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg"><path d="M76,242H608" stroke="currentColor" opacity=".10"/><text x="68" y="246" text-anchor="end">0</text><text x="76" y="262" text-anchor="start">0</text><path d="M76,194H608" stroke="currentColor" opacity=".10"/><text x="68" y="198" text-anchor="end">2.25</text><text x="209" y="262" text-anchor="middle">2</text><path d="M76,146H608" stroke="currentColor" opacity=".10"/><text x="68" y="150" text-anchor="end">4.5</text><text x="342" y="262" text-anchor="middle">4</text><path d="M76,98H608" stroke="currentColor" opacity=".10"/><text x="68" y="102" text-anchor="end">6.75</text><text x="475" y="262" text-anchor="middle">6</text><path d="M76,50H608" stroke="currentColor" opacity=".10"/><text x="68" y="54" text-anchor="end">9</text><text x="608" y="262" text-anchor="end">8</text><svg x="76" y="50" width="532" height="192" viewBox="76 50 532 192" overflow="hidden" data-plot-field="true" style="width:532px;height:192px;overflow:hidden"><path d="M76.00,50.00 L142.50,146.00 L209.00,242.00 L275.50,242.00 L342.00,242.00 L408.50,242.00 L475.00,242.00 L541.50,242.00 L608.00,242.00" fill="none" stroke="#40879a" stroke-width="2.1" /><path d="M76.00,146.00 L142.50,146.00 L209.00,146.00 L275.50,194.00 L342.00,242.00 L408.50,242.00 L475.00,242.00 L541.50,242.00 L608.00,242.00" fill="none" stroke="#bb7946" stroke-width="2.1" /></svg><text x="76" y="24">协方差 / DN²</text><text x="342" y="297" text-anchor="middle">另一输出位置 j</text></svg><path d="M30,454h24" fill="none" stroke="#40879a" stroke-width="2.5" /><text x="64" y="459" font-size="15">Cov(Y₀,Yⱼ)</text><path d="M400,454h24" fill="none" stroke="#bb7946" stroke-width="2.5" /><text x="434" y="459" font-size="15">Cov(Y₁,Yⱼ)</text><rect x="30" y="511" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="534" font-size="13" fill="#676d74">窗口真实标准差</text><text x="42" y="557" font-size="19" font-weight="600">1.912 DN</text><text x="42" y="583" font-size="12" fill="#676d74">把原始样本的有效权重平方后求和</text><rect x="282" y="511" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="534" font-size="13" fill="#676d74">误当独立</text><text x="294" y="557" font-size="19" font-weight="600">1.299 DN</text><text x="294" y="583" font-size="12" fill="#676d74">漏掉输出之间的协方差</text><rect x="534" y="511" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="534" font-size="13" fill="#676d74">重复观测标准差</text><text x="546" y="557" font-size="19" font-weight="600">1.913 DN</text><text x="546" y="583" font-size="12" fill="#676d74">8192次，N−1样本方差</text><text x="30" y="648" font-size="15">全协方差求和 3.65625 DN²；独立原始源权重计算 3.65625 DN²。二者差 0.0e+0。奇数位置方差为原始的一</text><text x="30" y="671" font-size="15">半，但相邻输出共享输入，不能按窗口像素数再假定独立降噪。</text></svg>