<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1110" viewBox="0 0 800 1110" role="img" aria-label="互动示意：EI、实际曝光、固定记录与监看链的真值对照" style="color:#303030;font:14px sans-serif"><style>text{fill:currentColor;font-family:sans-serif}</style><rect width="800" height="1110" fill="#fafafa"/><text x="30" y="40" font-size="24">EI改变了哪一级信号？</text><text x="30" y="76">EI 1600按表少曝一档，固定记录链；中灰500 e⁻，监看在线性域补2倍。</text><svg x="30" y="110" width="740" height="220" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-label="固定传感器范围内中灰上下方档位与独立物理真值" style="font:13px sans-serif"><text x="20" y="23">容量/读噪刻度：4 e⁻为0 stop。</text><path d="M155 80H608.802449963173" stroke="currentColor" stroke-width="18" opacity=".16"/><path d="M155 80H398.80244996317305" stroke="#40879a" stroke-width="18"/><path d="M398.80244996317305 80H608.802449963173" stroke="#bb7946" stroke-width="18"/><path d="M398.80244996317305 53V105" stroke="currentColor"/><text x="398.80244996317305" y="128" text-anchor="middle">中灰 500.0 e⁻</text><text x="155" y="57">4 e⁻</text><text x="608.802449963173" y="57" text-anchor="end">32000 e⁻</text><text x="20" y="162">下方 6.966 stop + 上方 6.000 stop = 12.966 stop</text></svg><text x="30" y="365">中灰上方6 stop、下方6.966 stop；传感器总工程比不变。</text><text x="30" y="400">输入端SNR=22.011；无量化中灰监看线性值0.18。</text><text x="30" y="428">探针 4.000 stop；传感器 / 文件上限 6.000 stop</text><svg x="30" y="435" width="740" height="335" role="img" aria-label="实际监看输出与保留相同截顶的无量化对照" viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg"><path d="M72,240H612" stroke="currentColor" opacity=".10"/><text x="64" y="244" text-anchor="end">0</text><text x="72" y="260" text-anchor="middle">-6</text><path d="M72,193.75H612" stroke="currentColor" opacity=".10"/><text x="64" y="197.75" text-anchor="end">0.25</text><text x="207" y="260" text-anchor="middle">-2.5</text><path d="M72,147.5H612" stroke="currentColor" opacity=".10"/><text x="64" y="151.5" text-anchor="end">0.5</text><text x="342" y="260" text-anchor="mi