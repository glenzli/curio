4.79076467820497" y="40" text-anchor="middle" font-size="13">G2 · 58.00 mm</text><g data-thin-group="20"><rect x="484.3116882103845" y="60" width="14" height="80" rx="7" fill="#2b82ac" fill-opacity=".09"/><path d="M491.3116882103845 60V140" stroke="#2b82ac" stroke-width="1.6"/><path d="M486.3116882103845 69L491.3116882103845 60L496.3116882103845 69M486.3116882103845 131L491.3116882103845 140L496.3116882103845 131" fill="none" stroke="#2b82ac" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="491.3116882103845" y="22" text-anchor="middle" font-size="13">G3 · 147.20 mm</text><path d="M655 45v110" stroke="#c1894d" stroke-width="3"/><text x="655" y="185" text-anchor="end" font-size="13">固定像面 200 mm</text><text x="35" y="185" font-size="13">z / mm · 径向尺寸×16</text></svg><rect x="30" y="352" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="375" font-size="13" fill="#676d74">G2位置</text><text x="42" y="398" font-size="19" font-weight="600">57.9970 mm</text><text x="42" y="424" font-size="12" fill="#676d74">前组与传感器固定</text><rect x="282" y="352" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="375" font-size="13" fill="#676d74">G3位置</text><text x="294" y="398" font-size="19" font-weight="600">147.1973 mm</text><text x="294" y="424" font-size="12" fill="#676d74">随物距求解</text><rect x="534" y="352" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="375" font-size="13" fill="#676d74">实际几何弥散直径</text><text x="546" y="398" font-size="19" font-weight="600">0.000000 μm</text><text x="546" y="424" font-size="12" fill="#676d74">未乘显示放大率</text><rect x="30" y="461" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="484" font-size="13" fill="#676d74">固定远景角尺度</text><text x="42" y="507" font-size="19" font-weight="600">100.0000 mm/rad</text><text x="42" y="533" font-size="12" fill="#676d74">比较点像中心</text><rect x="282" y="461" width="238" height="91" rx="7" fi