" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="484" font-size="13" fill="#676d74">实际近轴像面</text><text x="42" y="507" font-size="19" font-weight="600">200.0000 mm</text><text x="42" y="533" font-size="12" fill="#676d74">传感器始终固定在200 mm</text><rect x="282" y="461" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="484" font-size="13" fill="#676d74">传感器弥散直径</text><text x="294" y="507" font-size="19" font-weight="600">0.0000 μm</text><text x="294" y="533" font-size="12" fill="#676d74">未乘径向显示放大率</text><rect x="534" y="461" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="484" font-size="13" fill="#676d74">补偿解 / 解析差</text><text x="546" y="507" font-size="19" font-weight="600">0.00e+0 mm</text><text x="546" y="533" font-size="12" fill="#676d74">独立消元根与逐线求根</text><text x="30" y="598" font-size="15">回放逐一求出每个焦距所需的补偿位置，播放速度只便于观察。机械凸轮与马达控制还需给定实际速度、加速</text><text x="30" y="621" font-size="15">度和负载。</text></svg></svg>
