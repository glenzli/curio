<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740" role="img" aria-label="互动示意：FSI、BSI与逻辑堆栈的功能层序和结构核对" style="color:#263c33;font:14px sans-serif"><style>text{fill:currentColor;font-family:sans-serif}</style><rect width="900" height="740" fill="#fafbf9"/><text x="30" y="42" font-size="24">入光侧与逻辑堆栈：两条独立的分类轴</text><text x="30" y="77">橙色到感光硅为止；蓝色为光电转换之后的电信号。</text><text x="30" y="117" font-size="18">FSI · 同片电路</text><svg x="25" y="133" width="270" height="436" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" style="font:12px sans-serif" role="img" aria-label="FSI同片电路功能截面，入光和电子路径分开"><text x="30" y="17">入光 ↓</text><rect x="30" y="52" width="200" height="24" rx="3" fill="#829fb5" fill-opacity=".18" stroke="#829fb5"/><path d="M43 62Q74 39105 62M132 62Q163 39194 62" fill="none" stroke="#829fb5"/><text x="130" y="72" text-anchor="middle">微透镜 / CFA</text><rect x="30" y="97" width="200" height="30" rx="3" fill="#b79258" fill-opacity=".18" stroke="#b79258"/><rect x="34" y="102" width="38" height="20" fill="#b79258"/><rect x="113" y="102" width="113" height="20" fill="#b79258" fill-opacity=".5"/><text x="169" y="116" text-anchor="middle">晶体管 / 金属</text><rect x="30" y="148" width="200" height="68" rx="3" fill="#5798be" fill-opacity=".18" stroke="#5798be"/><text x="148" y="163">感光硅</text><rect x="62" y="170" width="60" height="24" rx="10" fill="#5798be" fill-opacity=".35" stroke="#5798be"/><text x="92" y="207" text-anchor="middle">PPD</text><rect x="30" y="237" width="200" height="28" rx="3" fill="#9caaa5" fill-opacity=".18" stroke="#9caaa5"/><text x="130" y="255" text-anchor="middle">承载基底</text><path d="M92,20L92,182" fill="none" stroke="#c89235" stroke-width="2" stroke-dasharray="4 3" opacity=".65"/><path d="M92,182L164,182L164,112L225,112" fill="none" stroke="#40879a" stroke-width="2" stroke-dasharray="3 3" opacity=".6"/><circle cx="225" cy="112" r="5" fill="#40879a"/><text x="30" y="398">本图读出链留在像素晶圆</text><text x="30" y="416">功能层序示意 · 非工艺比例</text></svg><text x="320" y="117" font-size="18">BSI · 同片电路</text><svg x="315" y="133" width="270" height="436" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" style="font:12px sans-serif" role="img" aria-label="BSI同片电路功能截面，入光和电子路径分开"><text x="30" y="17">入光 ↓</text><rect x="30" y="52" width="200" height="24" rx="3" fill="#829fb5" fill-opacity=".18" stroke="#829fb5"/><path d="M43 62Q74 39105 62M132 62Q163 39194 62" fill="none" stroke="#829fb5"/><text x="130" y="72" text-anchor="middle">微透镜 / CFA</text><rect x="30" y="97" width="200" height="68" rx="3" fill="#5798be" fill-opacity=".18" stroke="#5798be"/><text x="148" y="112">背面入光</text><rect x="62" y="119" width="60" height="24" rx="10" fill="#5798be" fill-opacity=".35" stroke="#5798be"/><text x="92" y="156" text-anchor="middle">PPD</text><rect x="30" y="186" width="200" height="30" rx="3" fill="#b79258" fill-opacity=".18" stroke="#b79258"/><rect x="34" y="191" width="38" height="20" fill="#b79258"/><rect x="113" y="191" width="113" height="20" fill="#b79258" fill-opacity=".5"/><text x="169" y="205" text-anchor="middle">晶体管 / 金属</text><rect x="30" y="237" width="200" height="28" rx="3" fill="#9caaa5" fill-opacity=".18" stroke="#9caaa5"/><text x="130" y="255" text-anchor="middle">承载基底</text><path d="M92,20L92,131" fill="none" stroke="#c89235" stroke-width="2" stroke-dasharray="4 3" opacity=".65"/><path d="M92,131L164,131L164,201L225,201" fill="none" stroke="#40879a" stroke-width="2" stroke-dasharray="3 3" opacity=".6"/><circle cx="225" cy="201" r="5" fill="#40879a"/><text x="30" y="398">本图读出链留在像素晶圆</text><text x="30" y="416">功能层序示意 · 非工艺比例</text></svg><text x="610" y="117" font-size="18">BSI · 逻辑堆栈</text><svg x="605" y="133" width="270" height="436" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" style="font:12px sans-serif" role="img" aria-label="BSI逻辑堆栈功能截面，入光和电子路径分开"><text x="30" y="17">入光 ↓</text><rect x="30" y="52" width="200" height="24" rx="3" fill="#829fb5" fill-opacity=".18" stroke="#829fb5"/><path d="M43 62Q74 39105 62M132 62Q163 39194 62" fill="none" stroke="#829fb5"/><text x="130" y="72" text-anchor="middle">微透镜 / CFA</text><rect x="30" y="97" width="200" height="68" rx="3" fill="#5798be" fill-opacity=".18" stroke="#5798be"/><text x="148" y="112">背面入光</text><rect x="62" y="119" width="60" height="24" rx="10" fill="#5798be" fill-opacity=".35" stroke="#5798be"/><text x="92" y="156" text-anchor="middle">PPD</text><rect x="30" y="186" width="200" height="30" rx="3" fill="#b79258" fill-opacity=".18" stroke="#b79258"/><rect x="34" y="191" width="38" height="20" fill="#b79258"/><rect x="113" y="191" width="113" height="20" fill="#b79258" fill-opacity=".5"/><text x="169" y="205" text-anchor="middle">晶体管 / 金属</text><rect x="30" y="237" width="200" height="16" rx="3" fill="#bda2bd" fill-opacity=".18" stroke="#bda2bd"/><path d="M53 237V253M198 237V253" stroke="#bda2bd" stroke-width="4"/><text x="124" y="249" text-anchor="middle">键合互连</text><rect x="30" y="274" width="200" height="44" rx="3" fill="#71a58b" fill-opacity=".18" stroke="#71a58b"/><text x="130" y="300" text-anchor="middle">独立逻辑晶圆</text><path d="M92,20L92,131" fill="none" stroke="#c89235" stroke-width="2" stroke-dasharray="4 3" opacity=".65"/><path d="M92,131L164,131L164,201L198,201L198,245L198,296L120,296" fill="none" stroke="#40879a" stroke-width="2" stroke-dasharray="3 3" opacity=".6"/><circle cx="120" cy="296" r="5" fill="#40879a"/><text x="30" y="398">电信号跨键合界面到逻辑晶圆</text><text x="30" y="416">功能层序示意 · 非工艺比例</text></svg><text x="30" y="605">到感光硅前经过前侧金属层：是 / 否 / 否</text><text x="30" y="637">独立逻辑晶圆：否 / 否 / 是；功能晶圆数：1 / 1 / 2。</text><text x="30" y="675">层距为展示间距；微透镜、CFA、支撑与键合不计入功能晶圆数。</text><text x="30" y="708">独立参照核对层序与连接；不由结构名称推算QE、噪声、读速或快门同步性。</text></svg>