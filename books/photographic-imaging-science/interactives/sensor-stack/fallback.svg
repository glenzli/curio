<text x="40" y="638" font-size="18" fill="#293744">FSI / BSI 区分入光侧；独立的逻辑晶圆使本例的功能晶圆数从 1 变为 2。</text>
<text x="40" y="675" font-size="16" fill="#6c7981">功能层序示意，厚度与间距不按工艺比例；布线留有入光开口，结构图不换算为器件性能。</text></svg>