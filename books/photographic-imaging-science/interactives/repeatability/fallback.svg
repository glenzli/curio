,219.70 L479.43,222.53 L483.87,225.07 L488.30,227.35 L492.73,229.37 L497.17,231.17 L501.60,232.75 L506.03,234.14 L510.47,235.34 L514.90,236.39 L519.33,237.29 L523.77,238.07 L528.20,238.73 L532.63,239.29 L537.07,239.77 L541.50,240.17 L545.93,240.50 L550.37,240.78 L554.80,241.02 L559.23,241.21 L563.67,241.36 L568.10,241.49 L572.53,241.60 L576.97,241.68 L581.40,241.75 L585.83,241.80 L590.27,241.84 L594.70,241.88 L599.13,241.91 L603.57,241.93 L608.00,241.94" fill="none" stroke="#8b78aa" stroke-width="2.1" stroke-dasharray="6 4"/><text x="76" y="24">概率密度（MTF⁻¹）</text><text x="342" y="297" text-anchor="middle">整套均值−0.600（×10⁻³）</text></svg><path d="M30,744h24" fill="none" stroke="#40879a" stroke-width="2.5" /><text x="64" y="749" font-size="15">256次完整采集</text><path d="M400,744h24" fill="none" stroke="#8b78aa" stroke-width="2.5" stroke-dasharray="6 4"/><text x="434" y="749" font-size="15">已知Gaussian均值分布</text><rect x="30" y="801" width="238" height="110" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="824" font-size="13" fill="#676d74">当前完整观测数</text><text x="42" y="847" font-size="19" font-weight="600">60</text><text x="42" y="873" font-size="12" fill="#676d74">4支 × 3次 × 5张；点图显露60条</text><rect x="282" y="801" width="238" height="110" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="824" font-size="13" fill="#676d74">均值标准差：已知 / 重复实测</text><text x="294" y="847" font-size="19" font-weight="600">0.02135 / 0.02253</text><text x="294" y="873" font-size="12" fill="#676d74">重复实测指256次完整合成采集</text><rect x="534" y="801" width="238" height="110" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="824" font-size="13" fill="#676d74">当前观测标准误：分组 / 当作独</text><text x="546" y="843" font-size="13" fill="#676d74">立</text><text x="546" y="866" font-size="19" font-weight="600">0.01862 / 0.00520</text><text x="546" y="892" font-size="12" fill="#676d74">不同的相关性假设，不是两条置信区间</text><text x="30" y="929" font-size="15">方差分量：生成值 / 原始矩估计；均方：观测 / 期望</text><text x="30" y="953" font-size="15">样品方差（MTF²）：0.001600 / 0.001204</text><text x="30" y="977" font-size="15">样品均方（MTF²）：0.020811 / 0.027350</text><text x="30" y="1001" font-size="15">装夹方差（MTF²）：0.000625 / 0.000501</text><text x="30" y="1025" font-size="15">装夹均方（MTF²）：0.002744 / 0.003350</text><text x="30" y="1049" font-size="15">拍摄方差（MTF²）：0.000225 / 0.000240</text><text x="30" y="1073" font-size="15">拍摄均方（MTF²）：0.000240 / 0.000225</text><text x="30" y="1097" font-size="15">对焦包围：33个候选，独立重复256次</text><text x="30" y="1121" font-size="15">被选中的观测最大值：0.914565</text><text x="30" y="1145" font-size="15">选中位置的生成响应：0.898131</text><text x="30" y="1169" font-size="15">选中位置的独立复测：0.898993</text><text x="30" y="1193" font-size="15">生成曲线峰值真值：0.902733</text><text x="30" y="1245" font-size="15">已知生成方差下，误把60条观测都当独立会得到均值标准差0.00639，正确嵌套预算为0.02135。同次装夹两张</text><text x="30" y="1268" font-size="15">的协方差为0.002225，同支不同装夹为0.001600。直方图范围外0/256次；负方差矩估计保留原值。对焦复测</text><text x="30" y="1291" font-size="15">使用新的测量噪声，不复用选择时的误差；增加候选点可能抬高被选中的观测最大值，不能据此宣称真实峰值</text><text x="30" y="1314" font-size="15">提高。</text></svg>