2" font-size="13" fill="#676d74">剩余偏差</text><text x="42" y="585" font-size="19" font-weight="600">3.00 e⁻</text><text x="42" y="611" font-size="12" fill="#676d74">含暗均值不匹配</text><rect x="282" y="539" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="562" font-size="13" fill="#676d74">当前RMSE</text><text x="294" y="585" font-size="19" font-weight="600">3.38 e⁻</text><text x="294" y="611" font-size="12" fill="#676d74">独立试验 3.39 e⁻</text><rect x="534" y="539" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="562" font-size="13" fill="#676d74">SNR下端信号</text><text x="546" y="585" font-size="19" font-weight="600">4.14 e⁻</text><text x="546" y="611" font-size="12" fill="#676d74">到32000 e⁻：12.92档</text><text x="30" y="676" font-size="15">误差方差 = (3²+4)/N + (3²+4)/M；均方误差另加偏差平方。8192组试验均值 3.01 e⁻，声明偏差 3.00 e⁻。</text><text x="30" y="699" font-size="15">SNR下端由正根 4.14005 e⁻ 与独立二分 4.14005 e⁻ 对照。</text></svg>