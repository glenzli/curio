<svg xmlns="http://www.w3.org/2000/svg" width="800" height="641" viewBox="0 0 800 641" role="img" aria-label="互动示意：同一次曝光从能量、光子、电子到码值与显示" style="color:#303030;font:16px sans-serif"><style>text{fill:currentColor;font-family:sans-serif}</style><rect width="800" height="100%" fill="#fafafa"/><text x="30" y="42" font-size="26">沿着同一次曝光往后看</text><text x="30" y="82">4 μm像素，550 nm，曝光量10⁻⁴ J/m²，QE 70%，模拟增益1。</text><svg x="30" y="127" width="740" height="310" class="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-label="六个处理环节与各自的单位"><rect x="10" y="12" width="196" height="126" rx="7" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.8"/><text x="22" y="44">像素收到能量</text><text x="22" y="88">1.600e-15 J</text><text x="22" y="120">1 / 6</text><rect x="222" y="12" width="196" height="126" rx="7" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="234" y="44">入射光子</text><text x="234" y="88">4430 个</text><text x="234" y="120">2 / 6</text><rect x="434" y="12" width="196" height="126" rx="7" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="446" y="44">信号电子</text><text x="446" y="88">3101 e⁻</text><text x="446" y="120">3 / 6</text><rect x="10" y="160" width="196" height="126" rx="7" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="22" y="192">读出电压</text><text x="22" y="236">0.0969 V</text><text x="22" y="268">4 / 6</text><rect x="222" y="160" width="196" height="126" rx="7" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="234" y="192">记录码值</text><text x="234" y="236">1588 DN</text><text x="234" y="268">5 / 6</text><rect x="434" y="160" width="196" height="126" rx="7" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="446" y="192">显示信号</text><text x="446" y="236">0.346</text><text x="446" y="268">6 / 6</text></svg><text x="30" y="457" font-size="17">当前环节：像素收到能量  第1章：面积×曝光量</text><text x="30" y="485" font-size="17">捕获的电子均值：3101.0 e⁻  上限32000 e⁻</text><text x="30" y="513" font-size="17">光子能量：3.6117e-19 J  550 nm；λ固定</text><text x="30" y="569" font-size="15">第1章：面积×曝光量。模拟增益为 1 倍，改变电压进入ADC的尺度；它不改变 4430.</text><text x="30" y="592" font-size="15">0 个平均入射光子。查看下一步不会重新曝光或重新采样，因而可以追踪同一组输入。</text></svg>