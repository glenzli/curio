<svg xmlns="http://www.w3.org/2000/svg" width="800" height="952" viewBox="0 0 800 952" role="img" aria-label="互动示意：微型DNG的IFD标签、CFA样本与黑白电平逐码核对" style="color:#303030;font:16px sans-serif"><style>text{fill:currentColor;font-family:sans-serif}</style><rect width="800" height="100%" fill="#fafafa"/><text x="30" y="42" font-size="26">从DNG字节读到一个马赛克样本</text><text x="30" y="82">32×32合成RGGB，黑电平64，白电平4095；小端TIFF、单条带。</text><svg x="30" y="127" width="740" height="310" class="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-label="所选样本附近的CFA码值"><text x="10" y="25">CFA标签与原始DN（行优先）</text><rect x="8" y="45" width="150" height="54" fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-opacity="0.8"/><text x="16" y="65" style="font-size:20px">R (0,0)</text><text x="16" y="88">32</text><rect x="164" y="45" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="172" y="65" style="font-size:20px">G (1,0)</text><text x="172" y="88">64</text><rect x="320" y="45" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="328" y="65" style="font-size:20px">R (2,0)</text><text x="328" y="88">4095</text><rect x="476" y="45" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="484" y="65" style="font-size:20px">G (3,0)</text><text x="484" y="88">4000</text><rect x="8" y="103" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="16" y="123" style="font-size:20px">G (0,1)</text><text x="16" y="146">261</text><rect x="164" y="103" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="172" y="123" style="font-size:20px">B (1,1)</text><text x="172" y="146">374</text><rect x="320" y="103" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="328" y="123" style="font-size:20px">G (2,1)</text><text x="328" y="146">487</text><rect x="476" y="103" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="484" y="123" style="font-size:20px">B (3,1)</text><text x="484" y="146">600</text><rect x="8" y="161" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="16" y="181" style="font-size:20px">R (0,2)</text><text x="16" y="204">458</text><rect x="164" y="161" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="172" y="181" style="font-size:20px">G (1,2)</text><text x="172" y="204">571</text><rect x="320" y="161" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="328" y="181" style="font-size:20px">R (2,2)</text><text x="328" y="204">684</text><rect x="476" y="161" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="484" y="181" style="font-size:20px">G (3,2)</text><text x="484" y="204">797</text><rect x="8" y="219" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="16" y="239" style="font-size:20px">G (0,3)</text><text x="16" y="262">655</text><rect x="164" y="219" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="172" y="239" style="font-size:20px">B (1,3)</text><text x="172" y="262">768</text><rect x="320" y="219" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="328" y="239" style="font-size:20px">G (2,3)</text><text x="328" y="262">881</text><rect x="476" y="219" width="150" height="54" fill="currentColor" fill-opacity="0.025" stroke="currentColor" stroke-opacity="0.2"/><text x="484" y="239" style="font-size:20px">B (3,3)</text><text x="484" y="262">994</text></svg><text x="30" y="457" font-size="17">所选样本：32 DN  生成真值 32 DN</text><text x="30" y="485" font-size="17">有符号归一化：-0.007938  (DN−64) / (4095−64)</text><text x="30" y="513" font-size="17">逐码不一致数：0 / 1024  文件 2760 字节；像素载荷2048字节</text><text x="30" y="541" font-size="15">标签 | 类型 / 数量 | 解码值</text><text x="30" y="565" font-size="15">BitsPerSample | 3 / 1 | 16</text><text x="30" y="589" font-size="15">Compression | 3 / 1 | 1</text><text x="30" y="613" font-size="15">PhotometricInterpretation | 3 / 1 | 32803</text><text x="30" y="637" font-size="15">StripOffsets | 4 / 1 | 712</text><text x="30" y="661" font-size="15">CFARepeatPatternDim | 3 / 2 | 2, 2</text><text x="30" y="685" font-size="15">CFAPattern | 1 / 4 | 0, 1, 1, 2</text><text x="30" y="709" font-size="15">DNGVersion | 1 / 4 | 1, 4, 0, 0</text><text x="30" y="733" font-size="15">BlackLevel | 5 / 1 | 64</text><text x="30" y="757" font-size="15">WhiteLevel | 4 / 1 | 4095</text><text x="30" y="781" font-size="15">ColorMatrix1 | 10 / 9 | 1, 0, 0, 0, 1, 0, 0,</text><text x="30" y="805" font-size="15"> 0, 1</text><text x="30" y="857" font-size="15">样本(0,0)的实际字节偏移 712，两个字节为 20 00。正确解码在全部1024码上</text><text x="30" y="880" font-size="15">与生成数组比对；改错黑电平不会改写文件字节，改错字节解释则会直接改码。下载样本的链接在正</text><text x="30" y="903" font-size="15">文中。</text></svg>