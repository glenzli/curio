<svg xmlns="http://www.w3.org/2000/svg" width="800" height="930" viewBox="0 0 800 930" role="img" aria-label="互动示意：微型DNG的IFD标签、CFA样本与黑白电平逐码核对" style="color:#303030;fill:currentColor;font:16px sans-serif"><style>text{font-family:sans-serif}</style><rect width="800" height="100%" fill="#fafafa"/><text x="30" y="42" font-size="26">从DNG字节读到一个马赛克样本</text><text x="30" y="82">32×32合成RGGB，黑电平64，白电平4095；小端TIFF、单条带。</text><svg x="30" y="127" width="740" height="310" class="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-label="所选样本附近的CFA码值"><text x="10" y="25">CFA通道与原始DN（行优先；底色标识滤色通道）</text><rect x="8" y="45" width="150" height="54" rx="5" fill="#c56b61" fill-opacity="0.25" stroke="currentColor" stroke-opacity="0.8"/><text x="16" y="65" style="font-size:16px">R (0,0)</text><text x="16" y="88">32</text><rect x="164" y="45" width="150" height="54" rx="5" fill="#539a74" fill-opacity="0.11" stroke="#539a74" stroke-opacity="0.3"/><text x="172" y="65" style="font-size:16px">G (1,0)</text><text x="172" y="88">64</text><rect x="320" y="45" width="150" height="54" rx="5" fill="#c56b61" fill-opacity="0.11" stroke="#c56b61" stroke-opacity="0.3"/><text x="328" y="65" style="font-size:16px">R (2,0)</text><text x="328" y="88">4095</text><rect x="476" y="45" width="150" height="54" rx="5" fill="#539a74" fill-opacity="0.11" stroke="#539a74" stroke-opacity="0.3"/><text x="484" y="65" style="font-size:16px">G (3,0)</text><text x="484" y="88">4000</text><rect x="8" y="103" width="150" height="54" rx="5" fill="#539a74" fill-opacity="0.11" stroke="#539a74" stroke-opacity="0.3"/><text x="16" y="123" style="font-size:16px">G (0,1)</text><text x="16" y="146">261</text><rect x="164" y="103" width="150" height="54" rx="5" fill="#4f83b7" fill-opacity="0.11" stroke="#4f83b7" stroke-opacity="0.3"/><text x="172" y="123" style="font-size:16px">B (1,1)</text><text x="172" y="146">374</text><rect x="320" y="103" width="150" height="54" rx="5" fill="#539a74" fill-opacity="0.11" stroke="#539a74" stroke-opacity="0.3"/><text x="328" y="123" style="font-size:16px">G (2,1)</text><text x="328" y="146">487</text><rect x="476" y="103" width="150" height="54" rx="5" fill="#4f83b7" fill-opacity="0.11" stroke="#4f83b7" stroke-opacity="0.3"/><text x="484" y="123" style="font-size:16px">B (3,1)</text><text x="484" y="146">600</text><rect x="8" y="161" width="150" height="54" rx="5" fill="#c56b61" fill-opacity="0.11" stroke="#c56b61" stroke-opacity="0.3"/><text x="16" y="181" style="font-size:16px">R (0,2)</text><text x="16" y="204">458</text><rect x="164" y="161" width="150" height="54" rx="5" fill="#539a74" fill-opacity="0.11" stroke="#539a74" stroke-opacity="0.3"/><text x="172" y="181" style="font-size:16px">G (1,2)</text><text x="172" y="204">571</text><rect x="320" y="161" width="150" height="54" rx="5" fill="#c56b61" fill-opacity="0.11" stroke="#c56b61" stroke-opacity="0.3"/><text x="328" y="181" style="font-size:16px">R (2,2)</text><text x="328" y="204">684</text><rect x="476" y="161" width="150" height="54" rx="5" fill="#539a74" fill-opacity="0.11" stroke="#539a74" stroke-opacity="0.3"/><text x="484" y="181" style="font-size:16px">G (3,2)</text><text x="484" y="204">797</text><rect x="8" y="219" width="150" height="54" rx="5" fill="#539a74" fill-opacity="0.11" stroke="#539a74" stroke-opacity="0.3"/><text x="16" y="239" style="font-size:16px">G (0,3)</text><text x="16" y="262">655</text><rect x="164" y="219" width="150" height="54" rx="5" fill="#4f83b7" fill-opacity="0.11" stroke="#4f83b7" stroke-opacity="0.3"/><text x="172" y="239" style="font-size:16px">B (1,3)</text><text x="172" y="262">768</text><rect x="320" y="219" width="150" height="54" rx="5" fill="#539a74" fill-opacity="0.11" stroke="#539a74" stroke-opacity="0.3"/><text x="328" y="239" style="font-size:16px">G (2,3)</text><text x="328" y="262">881</text><rect x="476" y="219" width="150" height="54" rx="5" fill="#4f83b7" fill-opacity="0.11" stroke="#4f83b7" stroke-opacity="0.3"/><text x="484" y="239" style="font-size:16px">B (3,3)</text><text x="484" y="262">994</text></svg><rect x="30" y="457" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="480" font-size="13" fill="#676d74">所选样本</text><text x="42" y="503" font-size="19" font-weight="600">32 DN</text><text x="42" y="529" font-size="12" fill="#676d74">生成真值 32 DN</text><rect x="282" y="457" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="480" font-size="13" fill="#676d74">有符号归一化</text><text x="294" y="503" font-size="19" font-weight="600">-0.007938</text><text x="294" y="529" font-size="12" fill="#676d74">(DN−64) / (4095−64)</text><rect x="534" y="457" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="480" font-size="13" fill="#676d74">逐码不一致数</text><text x="546" y="503" font-size="19" font-weight="600">0 / 1024</text><text x="546" y="529" font-size="12" fill="#676d74">文件 2760 字节；像素载荷2048字节</text><text x="30" y="566" font-size="15">标签 | 类型 / 数量 | 解码值</text><text x="30" y="590" font-size="15">BitsPerSample | 3 / 1 | 16</text><text x="30" y="614" font-size="15">Compression | 3 / 1 | 1</text><text x="30" y="638" font-size="15">PhotometricInterpretation | 3 / 1 | 32803</text><text x="30" y="662" font-size="15">StripOffsets | 4 / 1 | 712</text><text x="30" y="686" font-size="15">CFARepeatPatternDim | 3 / 2 | 2, 2</text><text x="30" y="710" font-size="15">CFAPattern | 1 / 4 | 0, 1, 1, 2</text><text x="30" y="734" font-size="15">DNGVersion | 1 / 4 | 1, 4, 0, 0</text><text x="30" y="758" font-size="15">BlackLevel | 5 / 1 | 64</text><text x="30" y="782" font-size="15">WhiteLevel | 4 / 1 | 4095</text><text x="30" y="806" font-size="15">ColorMatrix1 | 10 / 9 | 1, 0, 0, 0, 1, 0, 0, 0, 1</text><text x="30" y="858" font-size="15">样本(0,0)的实际字节偏移 712，两个字节为 20 00。正确解码在全部1024码上与生成数组比对；改错黑电平</text><text x="30" y="881" font-size="15">不会改写文件字节，改错字节解释则会直接改码。下载样本的链接在正文中。</text></svg>