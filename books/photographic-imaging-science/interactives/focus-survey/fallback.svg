各点各自最佳时，Gaussian模型的MTF上限为 0.9027</text><text x="30" y="1255" font-size="15">；固定传感器位置的读数必须另报。对焦包围只在观测扫描数组中找最大值，不读取生成焦点。单次四角差异</text><text x="30" y="1278" font-size="15">不能自动归因于镜头偏心。</text></svg>