 x="30" y="1108" font-size="15">左上 | 75 / 75 | 45 / 45</text><text x="30" y="1132" font-size="15">右上 | 75 / 75 | 45 / 45</text><text x="30" y="1156" font-size="15">左下 | 75 / 75 | 45 / 45</text><text x="30" y="1180" font-size="15">右下 | 75 / 75 | 45 / 45</text><text x="30" y="1232" font-size="15">曲率匹配可减少共同离焦，但不会消除两方向焦面分离。各点各自最佳时，Gaussian模型的MTF上限为 0.9027</text><text x="30" y="1255" font-size="15">；固定传感器位置的读数必须另报。对焦包围只在观测扫描数组中找最大值，不读取生成焦点。单次四角差异</text><text x="30" y="1278" font-size="15">不能自动归因于镜头偏心。</text></svg>