<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2474" viewBox="0 0 800 2474" role="img" aria-label="互动示意：增距镜、延长管与反装的共轭和光量"><rect width="800" height="2474" fill="#f8f8f8"/><svg x="0" y="0" xmlns="http://www.w3.org/2000/svg" width="800" height="805" viewBox="0 0 800 805" role="img" aria-label="互动示意：增距镜、延长管与反装的共轭和光量" style="color:#303030;fill:currentColor;font:16px sans-serif"><style>text{font-family:sans-serif}</style><rect width="800" height="100%" fill="#fafafa"/><text x="30" y="42" font-size="26">延长管：像距、物距与放大率</text><text x="30" y="82">对称薄透镜50 mm、f/4，原先对焦无穷远，加25 mm空延长管；放大率0.5。</text><svg x="30" y="127" width="740" height="340" class="drawing" role="img" aria-label="近轴共轭与附件光路" viewBox="0 0 740 340"><style>text{font-family:inherit;fill:currentColor}</style><text x="24" y="30">物距、像距从同一薄透镜量起 · mm</text><path d="M40 155H710" stroke="currentColor" opacity=".2"/><g data-thin-group="0.02"><rect x="450.1276595744681" y="90" width="14" height="130" rx="7" fill="#596979" fill-opacity=".09"/><path d="M457.1276595744681 90V220" stroke="#596979" stroke-width="1.6"/><path d="M452.1276595744681 99L457.1276595744681 90L462.1276595744681 99M452.1276595744681 211L457.1276595744681 220L462.1276595744681 211" fill="none" stroke="#596979" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M658.1914893617021 80v150" stroke="#b67f44" stroke-width="3"/><polyline points="55,135 457.1276595744681,165 658.1914893617021,165" fill="none" stroke="#388da7" stroke-width="2"/><path d="M579.8085106382979 167.8L585.8085106382979 165L579.8085106382979 162.2" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="55,135 457.1276595744681,155 658.1914893617021,165" fill="none" stroke="#388da7" stroke-width="2"/><path d="M579.6768304030179 163.8984990478837L585.8085106382979 161.4L579.9550050855064 158.30541234678364" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="55,135 457.1276595744681,145 658.1914893617021,165" fill="none" stroke="#388da7" stroke-width="2"/><path d="M579.5608247778101 159.99235521498272L585.8085106382979 157.8L580.1151263076694 154.41985579246185" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 155v-20" stroke="#8e77ab" stroke-width="3"/><text x="55" y="256">物体：s=150.00 mm</text><text x="457.1276595744681" y="256" text-anchor="middle">透镜</text><text x="658.1914893617021" y="285" text-anchor="end">像距 75.00 mm</text><text x="370" y="321" text-anchor="middle" font-size="16">三条近轴示例光线；未绘制全孔径光锥，横纵比例不同</text></svg><rect x="30" y="487" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="510" font-size="13" fill="#676d74">放大率 |m|</text><text x="42" y="533" font-size="19" font-weight="600">0.500</text><text x="42" y="559" font-size="12" fill="#676d74">原放大率 + 新增延长量/f</text><rect x="282" y="487" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="510" font-size="13" fill="#676d74">物距 / 像距</text><text x="294" y="533" font-size="19" font-weight="600">150.00 mm / 75.00 mm</text><text x="294" y="559" font-size="12" fill="#676d74">各自由薄镜平面量起</text><rect x="534" y="487" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="510" font-size="13" fill="#676d74">传感器到物体</text><text x="546" y="533" font-size="19" font-weight="600">225.00 mm</text><text x="546" y="559" font-size="12" fill="#676d74">实际工作距离须按镜头前端另量</text><rect x="30" y="596" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="619" font-size="13" fill="#676d74">有效f数</text><text x="42" y="642" font-size="19" font-weight="600">6.00</text><text x="42" y="668" font-size="12" fill="#676d74">瞳倍率1的近轴模型</text><rect x="282" y="596" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="619" font-size="13" fill="#676d74">曝光补偿</text><text x="294" y="642" font-size="19" font-weight="600">1.17档</text><text x="294" y="668" font-size="12" fill="#676d74">光量因子 2.25</text><rect x="534" y="596" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="619" font-size="13" fill="#676d74">独立光线像高误差</text><text x="546" y="642" font-size="19" font-weight="600">0.00e+0 mm</text><text x="546" y="668" font-size="12" fill="#676d74">角度更新与薄透镜解析式</text><text x="30" y="733" font-size="15">36 mm宽传感器在该倍率下覆盖物方宽度72.00 mm。固定薄镜的传感器到物体距离在|m|=1处最小，为4f；继续</text><text x="30" y="756" font-size="15">加长虽让物体靠近透镜，却不保证它继续靠近传感器。</text></svg><svg x="0" y="821" xmlns="http://www.w3.org/2000/svg" width="800" height="815" viewBox="0 0 800 815" role="img" aria-label="互动示意：增距镜、延长管与反装的共轭和光量" style="color:#303030;fill:currentColor;font:16px sans-serif"><style>text{font-family:sans-serif}</style><rect width="800" height="100%" fill="#fafafa"/><text x="30" y="42" font-size="26">增距镜：会聚光束中的负光焦度</text><text x="30" y="82">主镜100 mm、f/4；负组位于80 mm，原焦面前20 mm；2倍增距后在120 mm处成像，等效200 mm f/8。</text><svg x="30" y="127" width="740" height="350" class="drawing" role="img" aria-label="近轴共轭与附件光路" viewBox="0 0 740 350"><style>text{font-family:inherit;fill:currentColor}</style><text x="24" y="30">正主镜使光束会聚，负增距组减小会聚角</text><path d="M40 150H705" stroke="currentColor" opacity=".2"/><g data-thin-group="0.01"><rect x="58" y="78" width="14" height="144" rx="7" fill="#596979" fill-opacity=".09"/><path d="M65 78V222" stroke="#596979" stroke-width="1.6"/><path d="M60 87L65 78L70 87M60 213L65 222L70 213" fill="none" stroke="#596979" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g data-thin-group="-0.025"><rect x="413.55555555555554" y="85" width="14" height="130" rx="7" fill="#596979" fill-opacity=".09"/><path d="M420.55555555555554 85V215" stroke="#596979" stroke-width="1.6"/><path d="M415.55555555555554 85L420.55555555555554 94L425.55555555555554 85M415.55555555555554 215L420.55555555555554 206L425.55555555555554 215" fill="none" stroke="#596979" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M509.44444444444446 70v160" stroke="currentColor" opacity=".4" stroke-dasharray="4 4"/><path d="M598.3333333333334 70v160" stroke="#b67f44" stroke-width="3"/><polyline points="40,183.5707963267949 65,182 420.55555555555554,134.05978557447258 598.3333333333334,94.14946393618146" fill="none" stroke="#388da7" stroke-width="2"/><path d="M529.0923653801138 112.56344404176751L534.3333333333334 108.51717972596626L527.8657206833885 107.09943976029082" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="40,151.5707963267949 65,150 420.55555555555554,127.65978557447258 598.3333333333334,94.14946393618145" fill="none" stroke="#388da7" stroke-width="2"/><path d="M528.9558201319297 110.07612572205909L534.3333333333334 106.21317972596626L527.9185122288569 104.57303637931508" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="40,119.57079632679489 65,118 420.55555555555554,121.25978557447257 598.3333333333334,94.14946393618145" fill="none" stroke="#388da7" stroke-width="2"/><path d="M528.8240120893169 107.58169649655132L534.3333333333334 103.90917972596625L527.9797966151956 102.04569611421262" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="258">主镜</text><text x="420.55555555555554" y="258" text-anchor="middle">增距组</text><text x="509.44444444444446" y="290" text-anchor="middle">原焦面</text><text x="598.3333333333334" y="258" text-anchor="middle">新焦面</text><text x="370" y="327" text-anchor="middle" font-size="16">δ=20.00 mm → 余下像程 Mδ=40.00 mm；横纵比例不同</text></svg><rect x="30" y="497" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="520" font-size="13" fill="#676d74">等效焦距</text><text x="42" y="543" font-size="19" font-weight="600">200.00 mm</text><text x="42" y="569" font-size="12" fill="#676d74">主镜焦距乘以M</text><rect x="282" y="497" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="520" font-size="13" fill="#676d74">新f数</text><text x="294" y="543" font-size="19" font-weight="600">8.00</text><text x="294" y="569" font-size="12" fill="#676d74">入瞳不变</text><rect x="534" y="497" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="520" font-size="13" fill="#676d74">曝光补偿</text><text x="546" y="543" font-size="19" font-weight="600">2.00档</text><text x="546" y="569" font-size="12" fill="#676d74">几何损失；透射另计</text><rect x="30" y="606" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="629" font-size="13" fill="#676d74">负组焦距</text><text x="42" y="652" font-size="19" font-weight="600">-40.00 mm</text><text x="42" y="678" font-size="12" fill="#676d74">随当前教学倍率重选</text><rect x="282" y="606" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="629" font-size="13" fill="#676d74">主镜后新像面 z</text><text x="294" y="652" font-size="19" font-weight="600">120.00 mm</text><text x="294" y="678" font-size="12" fill="#676d74">原焦面 z=100 mm</text><rect x="534" y="606" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="629" font-size="13" fill="#676d74">光线/矩阵/解析对照</text><text x="546" y="652" font-size="19" font-weight="600">2.84e-14 mm</text><text x="546" y="678" font-size="12" fill="#676d74">独立逐线追迹与增距公式</text><text x="30" y="743" font-size="15">输入方向0.5°在新像面上的近轴像高为1.745 mm。负组使原余下20.00 mm像程变为40.00 mm，焦距增大2.0倍</text><text x="30" y="766" font-size="15">，f数也增大相同倍数。</text></svg><svg x="0" y="1652" xmlns="http://www.w3.org/2000/svg" width="800" height="806" viewBox="0 0 800 806" role="img" aria-label="互动示意：增距镜、延长管与反装的共轭和光量" style="color:#303030;fill:currentColor;font:16px sans-serif"><style>text{font-family:sans-serif}</style><rect width="800" height="100%" fill="#fafafa"/><text x="30" y="42" font-size="26">反装：交换原来的大小共轭</text><text x="30" y="82">50 mm薄透镜，原共轭300 mm→60 mm，倍率−0.2；交换后60 mm→300 mm，倍率−5。</text><svg x="30" y="127" width="740" height="450" class="drawing" role="img" aria-label="近轴共轭与附件光路" viewBox="0 0 740 450"><style>text{font-family:inherit;fill:currentColor}</style><text x="24" y="36">原来的大物方 → 小像方</text><path d="M40 110H710" stroke="currentColor" opacity=".2"/><g data-thin-group="0.02"><rect x="573" y="58" width="14" height="104" rx="7" fill="#596979" fill-opacity=".09"/><path d="M580 58V162" stroke="#596979" stroke-width="1.6"/><path d="M575 67L580 58L585 67M575 153L580 162L585 153" fill="none" stroke="#596979" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M55 110v-48" stroke="#8e77ab" stroke-width="3"/><path d="M685 110v9.600000000000001" stroke="#b67f44" stroke-width="3"/><polyline points="55,62 580,128 685,119.6" fill="none" stroke="#388da7" stroke-width="2"/><path d="M641.4423949511753 125.89355411359848L647.2 122.624L640.9958217063912 120.31138855379619" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="55,62 580,110 685,119.6" fill="none" stroke="#388da7" stroke-width="2"/><path d="M640.969984731185 118.38607710624142L647.2 116.14399999999999L641.479858103569 112.8093370957932" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="55,62 580,92 685,119.6" fill="none" stroke="#388da7" stroke-width="2"/><path d="M640.6853039618395 110.84668149997148L647.2 109.664L642.1089430010575 105.43066341598998" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="185">物距 300.00 mm</text><text x="685" y="185" text-anchor="end">像距 60.00 mm；m=-0.20</text><text x="24" y="246">交换共轭并倒转镜头：小物方 → 大像方</text><path d="M40 320H710" stroke="currentColor" opacity=".2"/><g data-thin-group="0.02"><rect x="153" y="268" width="14" height="104" rx="7" fill="#596979" fill-opacity=".09"/><path d="M160 268V372" stroke="#596979" stroke-width="1.6"/><path d="M155 277L160 268L165 277M155 363L160 372L165 363" fill="none" stroke="#596979" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M55 320v-9.600000000000001" stroke="#8e77ab" stroke-width="3"/><path d="M685 320v48" stroke="#b67f44" stroke-width="3"/><polyline points="55,310.4 160,338 685,368" fill="none" stroke="#388da7" stroke-width="2"/><path d="M489.8500325799483 359.65314099315606L496 357.2L490.169511406964 354.06226152038175" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="55,310.4 160,320 685,368" fill="none" stroke="#388da7" stroke-width="2"/><path d="M489.769984731185 352.96207710624145L496 350.72L490.2798581035688 347.3853370957932" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="55,310.4 160,302 685,368" fill="none" stroke="#388da7" stroke-width="2"/><path d="M489.6976065422099 346.2697380873415L496 344.24L490.39610858790957 340.71347181473067" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="395">物距 60.00 mm</text><text x="685" y="395" text-anchor="end">像距 300.00 mm；m=-5.00</text><text x="370" y="427" text-anchor="middle" font-size="16">薄透镜翻转本身不改变焦距；倍率来自物像共轭与安装距离</text></svg><rect x="30" y="597" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="620" font-size="13" fill="#676d74">焦距</text><text x="42" y="643" font-size="19" font-weight="600">50.00 mm</text><text x="42" y="669" font-size="12" fill="#676d74">倒转前后相同</text><rect x="282" y="597" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="620" font-size="13" fill="#676d74">原倍率 / 倒转后倍率</text><text x="294" y="643" font-size="19" font-weight="600">-0.20 / -5.00</text><text x="294" y="669" font-size="12" fill="#676d74">两者乘积为1</text><rect x="534" y="597" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="620" font-size="13" fill="#676d74">交换后的物距 / 像距</text><text x="546" y="643" font-size="19" font-weight="600">60.00 / 300.00 mm</text><text x="546" y="669" font-size="12" fill="#676d74">两个共轭平面互换</text><text x="30" y="734" font-size="15">反接环先解决安装方向；实际倍率还由卡口到主平面的距离、延长量和对焦状态决定。原像方成为近物方，有</text><text x="30" y="757" font-size="15">机会把镜头用于更合适的大倍率共轭。工作距离、光圈控制和裸露的原后组也要分别检查。</text></svg></svg>
