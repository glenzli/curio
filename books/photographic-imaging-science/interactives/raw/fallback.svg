t="45" fill="#b47b4330"/><text x="484" y="292" text-anchor="middle">1</text><rect x="501" y="262" width="30" height="45" fill="#448b9830"/><text x="516" y="292" text-anchor="middle">1</text><rect x="533" y="262" width="30" height="45" fill="#448b9830"/><text x="548" y="292" text-anchor="middle">0</text><rect x="565" y="262" width="30" height="45" fill="#448b9830"/><text x="580" y="292" text-anchor="middle">1</text><rect x="597" y="262" width="30" height="45" fill="#448b9830"/><text x="612" y="292" text-anchor="middle">0</text><text x="688" y="243">b2 = 0x12</text><rect x="688" y="262" width="30" height="45" fill="#b47b4330"/><text x="703" y="292" text-anchor="middle">0</text><rect x="720" y="262" width="30" height="45" fill="#b47b4330"/><text x="735" y="292" text-anchor="middle">0</text><rect x="752" y="262" width="30" height="45" fill="#b47b4330"/><text x="767" y="292" text-anchor="middle">0</text><rect x="784" y="262" width="30" height="45" fill="#b47b4330"/><text x="799" y="292" text-anchor="middle">1</text><rect x="816" y="262" width="30" height="45" fill="#b47b4330"/><text x="831" y="292" text-anchor="middle">0</text><rect x="848" y="262" width="30" height="45" fill="#b47b4330"/><text x="863" y="292" text-anchor="middle">0</text><rect x="880" y="262" width="30" height="45" fill="#b47b4330"/><text x="895" y="292" text-anchor="middle">1</text><rect x="912" y="262" width="30" height="45" fill="#b47b4330"/><text x="927" y="292" text-anchor="middle">0</text><path d="M500 331V375m-8-10 8 10 8-10" fill="none" stroke="#708794" stroke-width="2"/><text x="58" y="417">按相同约定解码：A′=0xabc，B′=0x123，逐码相同。</text><text class="small" x="58" y="463">打包改变存储位置；存盘前丢位或读错 nibble 顺序会改变结果。</text><text class="small" x="58" y="498">本图只表示正文声明的教学约定，不是某个 RAW 文件格式的通用字节布局。</text></svg>
