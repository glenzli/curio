500 px</text><text x="294" y="1602" font-size="12" fill="#676d74">只用于核对，不送给相关器</text><rect x="534" y="1530" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="1553" font-size="13" fill="#676d74">当前镜组位置</text><text x="546" y="1576" font-size="19" font-weight="600">0.2000 mm</text><text x="546" y="1602" font-size="12" fill="#676d74">动画在相邻位置指令间插值</text><rect x="30" y="1639" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="1662" font-size="13" fill="#676d74">观测扫描最大位置</text><text x="42" y="1685" font-size="19" font-weight="600">0.0000 mm</text><text x="42" y="1711" font-size="12" fill="#676d74">独立扫描；已知焦点0 mm仅作对照</text><rect x="282" y="1639" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="1662" font-size="13" fill="#676d74">标定斜率</text><text x="294" y="1685" font-size="19" font-weight="600">22.5 px/mm</text><text x="294" y="1711" font-size="12" fill="#676d74">焦点附近的位移关系</text><rect x="534" y="1639" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="1662" font-size="13" fill="#676d74">图像采集次数</text><text x="546" y="1685" font-size="19" font-weight="600">1</text><text x="546" y="1711" font-size="12" fill="#676d74">停止后不生成新观测</text><text x="30" y="1776" font-size="15">半瞳图像的有符号偏移决定校正方向。当前生成偏移为4.500 px；相关峰不唯一时保留镜组位置。对比度扫描</text><text x="30" y="1799" font-size="15">比较整幅合并图像的方差，其最大位置受噪声和位置步长影响。</text></svg>