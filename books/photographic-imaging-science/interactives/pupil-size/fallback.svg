<svg xmlns="http://www.w3.org/2000/svg" width="800" height="845" viewBox="0 0 800 845" role="img" aria-label="互动示意：焦距光圈、实际光孔、前部通光包络与毛坯质量" style="color:#303030;fill:currentColor;font:16px sans-serif"><style>text{font-family:sans-serif}</style><rect width="800" height="100%" fill="#fafafa"/><text x="30" y="42" font-size="26">焦距、入瞳与通光余量</text><text x="30" y="82">400 mm、f/4；入瞳放大率1.5；空前部空间40 mm、半视场8°；厚10 mm、密度2.5 g/cm³。</text><svg x="30" y="127" width="740" height="380" class="drawing" role="img" aria-label="前部无遮挡空间中的光束包络与入瞳" viewBox="0 0 740 380"><style>text{font-family:inherit;fill:currentColor}</style><path d="M45 165H690" stroke="currentColor" opacity=".2"/><text x="110" y="34" text-anchor="middle">前部开口</text><text x="540" y="62" text-anchor="middle">入瞳参考平面</text><path d="M110,226.12649520437958L540,233.86969921509302" fill="none" stroke="#af824f" stroke-width="2" opacity=".8"/><path d="M379.150559878002 233.77366471234745L385.2 231.08214577123618L379.2513852587408 228.1745724428274" fill="none" stroke="#af824f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,88.38709677419354L540,96.13030078490699" fill="none" stroke="#af824f" stroke-width="2" opacity=".8"/><path d="M379.150559878002 96.03426628216138L385.2 93.34274734105014L379.2513852587408 90.43517401264137" fill="none" stroke="#af824f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,233.86969921509302L540,233.86969921509302" fill="none" stroke="#388da7" stroke-width="2" opacity=".8"/><path d="M379.2 236.66969921509303L385.2 233.86969921509302L379.2 231.069699215093" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,96.13030078490699L540,96.13030078490699" fill="none" stroke="#388da7" stroke-width="2" opacity=".8"/><path d="M379.2 98.93030078490699L385.2 96.13030078490699L379.2 93.330300784907" fill="none" stroke="#388da7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,241.61290322580646L540,233.86969921509302" fill="none" stroke="#8e78ad" stroke-width="2" opacity=".8"/><path d="M379.2513852587408 239.56482598735863L385.2 236.65725265894986L379.150559878002 233.9657337178386" fill="none" stroke="#8e78ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,103.87350479562043L540,96.13030078490699" fill="none" stroke="#8e78ad" stroke-width="2" opacity=".8"/><path d="M379.2513852587408 101.8254275571726L385.2 98.91785422876383L379.150559878002 96.22633528765259" fill="none" stroke="#8e78ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 70V88.38709677419354m0 153.22580645161293V260" stroke="currentColor" stroke-width="5"/><path d="M540 96.13030078490699V233.86969921509302" stroke="#388da7" stroke-width="3"/><text x="558" y="157">D入瞳</text><text x="325" y="287" text-anchor="middle">空前部空间 ℓ=40.00 mm · 无折射面</text><text x="370" y="324" text-anchor="middle">实际光孔直径 = 入瞳直径 / 前组瞳放大率</text><text x="370" y="355" text-anchor="middle" font-size="16">各颜色为不同入射方向，仍是同一波长；纵向尺寸按数值读取</text></svg><rect x="30" y="527" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="550" font-size="13" fill="#676d74">入瞳直径</text><text x="42" y="573" font-size="19" font-weight="600">100.00 mm</text><text x="42" y="599" font-size="12" fill="#676d74">由焦距与f数决定</text><rect x="282" y="527" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="550" font-size="13" fill="#676d74">实际光孔直径</text><text x="294" y="573" font-size="19" font-weight="600">66.67 mm</text><text x="294" y="599" font-size="12" fill="#676d74">另受瞳放大率影响</text><rect x="534" y="527" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="546" y="550" font-size="13" fill="#676d74">前部所需开口</text><text x="546" y="573" font-size="19" font-weight="600">111.24 mm</text><text x="546" y="599" font-size="12" fill="#676d74">仅对所声明的空前部模型</text><rect x="30" y="636" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="42" y="659" font-size="13" fill="#676d74">圆柱毛坯质量</text><text x="42" y="682" font-size="19" font-weight="600">243.0 g</text><text x="42" y="708" font-size="12" fill="#676d74">几何与密度的示意预算</text><rect x="282" y="636" width="238" height="91" rx="7" fill="#fff" stroke="#dedfe2"/><text x="294" y="659" font-size="13" fill="#676d74">包络/边缘光线差</text><text x="294" y="682" font-size="19" font-weight="600">0.00e+0 mm</text><text x="294" y="708" font-size="12" fill="#676d74">解析包络与逐线坐标独立对照</text><text x="30" y="773" font-size="15">入瞳截面积7854.0 mm²。只改变瞳放大率会改变实际光孔，不改变这一级轴上收光要求；视场与前部空间另增</text><text x="30" y="796" font-size="15">加通光余量。固定厚度时圆柱质量随直径平方变化，厚度也同比放大时才按立方缩放。</text></svg>