<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-label="互动示意：双侧远心中继的主光线与边缘光线"><rect width="800" height="650" fill="#fafbfc"/><style>text{font-family:system-ui,'PingFang SC',sans-serif;fill:#30343a}</style><text x="30" y="40" font-size="25">双侧远心中继的光阑与主光线</text><text x="30" y="76" font-size="16">f₁=50 mm，f₂=75 mm；前焦面 z=−50 mm，后焦面 z=200 mm。</text><svg x="30" y="100" width="740" height="415" role="img" aria-label="两透镜、光阑、主光线及边缘光线构成的远心光路" viewBox="0 0 520 280"><text x="35" y="18">穿过光阑中心的是主光线；横、纵比例不同</text><path d="M35 150H485" stroke="currentColor" opacity=".2"/><path d="M54.494584837545126 111.14285714285714L135.72202166064983 120.85714285714286L216.9494584837545 159.71428571428572L338.7906137184116 218L460.6317689530686 208.28571428571428" fill="none" stroke="#b47b43" stroke-width="1.3" opacity="0.65"/><path d="M54.494584837545126 111.14285714285714L135.72202166064983 111.14285714285714L216.9494584837545 150L338.7906137184116 208.28571428571428L460.6317689530686 208.28571428571428" fill="none" stroke="#448b98" stroke-width="2.3" opacity="1"/><path d="M54.494584837545126 111.14285714285714L135.72202166064983 101.42857142857143L216.9494584837545 140.28571428571428L338.7906137184116 198.57142857142856L460.6317689530686 208.28571428571428" fill="none" stroke="#b47b43" stroke-width="1.3" opacity="0.65"/><g data-thin-group="20"><rect x="128.72202166064983" y="82" width="14" height="143" rx="7" fill="#448b98" fill-opacity=".09"/><path d="M135.72202166064983 82V225" stroke="#448b98" stroke-width="1.6"/><path d="M130.72202166064983 91L135.72202166064983 82L140.72202166064983 91M130.72202166064983 216L135.72202166064983 225L140.72202166064983 216" fill="none" stroke="#448b98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g data-thin-group="13.333333333333334"><rect x="331.7906137184116" y="82" width="14" height="143" rx="7" fill="#448b98" fill-opacity=".09"/><path d="M338.7906137184116 82V225" stroke="#448b98" stroke-width="1.6"/><path d="M333.7906137184116 91L338.7906137184116 82L343.7906137184116 91M333.7906137184116 216L338.7906137184116 225L343.7906137184116 216" fill="none" stroke="#448b98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M216.9494584837545 82V140.28571428571428M216.9494584837545 159.71428571428572V225" stroke="#8b78aa" stroke-width="4"/><path d="M460.6317689530686 82V225" stroke="#8b78aa" stroke-width="2" opacity=".6"/><circle cx="54.494584837545126" cy="111.14285714285714" r="3.5" fill="#448b98"/><text x="54.494584837545126" y="43" text-anchor="middle">物点</text><text x="135.72202166064983" y="61" text-anchor="middle">f₁=50 mm</text><text x="216.9494584837545" y="43" text-anchor="middle">光阑</text><text x="338.7906137184116" y="61" text-anchor="middle">f₂=75 mm</text><text x="460.6317689530686" y="43" text-anchor="middle">像面</text><text x="135.72202166064983" y="246" text-anchor="middle">0</text><text x="216.9494584837545" y="246" text-anchor="middle">50</text><text x="338.7906137184116" y="246" text-anchor="middle">125</text><text x="460.6317689530686" y="246" text-anchor="middle">200</text><text x="260" y="270" text-anchor="middle">轴向位置 z / mm · 第一组位于0</text></svg><text x="30" y="548" font-size="16">带箭头的竖线为薄组；粗开口为光阑；穿过光阑中心的是主光线。</text><text x="30" y="579" font-size="16">独立几何参照：物方远心 成立；像方远心 成立。</text><text x="30" y="610" font-size="16">薄组定位等效平面；横纵比例不同。物距、像距和主光线倾角在互动中分别读数。</text></svg>
